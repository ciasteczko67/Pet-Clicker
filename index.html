<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pet Clicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#00a2ff; --dark:#1f2123; --panel:#2f3235; --green:#02b757; --red:#e2231a; --yellow:#ffc800;
    --Common:#cfd8dc; --Uncommon:#5dff7a; --Rare:#3fb4ff; --Epic:#c26bff; --Legendary:#ffc400; --Mythic:#ff3d77; --Secret:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Gotham","Source Sans Pro","Trebuchet MS",Arial,sans-serif;font-weight:800;color:#fff;text-transform:capitalize}
  body{
    background:
      radial-gradient(circle at 50% 120%,#0a3d8f 0,transparent 60%),
      linear-gradient(135deg,rgba(255,255,255,.07) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.07) 75%,transparent 75%) 0 0/64px 64px,
      linear-gradient(#52c0ff,#0b6fd1);
    animation:bg 8s linear infinite;
  }
  @keyframes bg{to{background-position:0 0,64px 64px,0 0}}
  #floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  #floaters span{position:absolute;bottom:-60px;font-size:34px;opacity:.25;animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-115vh) rotate(360deg)}}
  #app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:1150px;margin:0 auto;padding:10px;gap:10px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  h1{margin:0;font-size:clamp(30px,5vw,50px);letter-spacing:1px;color:#fff;text-shadow:0 5px 0 #0a4a8f,0 8px 0 #0006;-webkit-text-stroke:3px #0a2a52;paint-order:stroke fill;transform:rotate(-2deg)}
  .box{background:var(--dark);border:4px solid #0d0e0f;border-radius:14px;box-shadow:0 6px 0 #0007,inset 0 2px 0 #fff2}
  .coins{padding:8px 18px;font-size:clamp(20px,3vw,28px);color:var(--yellow);display:flex;align-items:center;gap:10px;background:linear-gradient(#2f3235,#1f2123)}
  .coins small{color:#bbb;font-size:12px;display:block;line-height:1}
  .coin-ico{font-size:34px;animation:spin 3s ease-in-out infinite}
  @keyframes spin{50%{transform:rotateY(180deg)}}
  .btn{font-family:inherit;font-weight:800;text-transform:capitalize;color:#fff;border:3px solid #0d0e0f;border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer;background:linear-gradient(#27b5ff,#0087e0);box-shadow:0 5px 0 #0a4a8f,inset 0 2px 0 #fff5;text-shadow:0 2px 0 #0006;transition:transform .05s,filter .1s}
  .btn:hover{filter:brightness(1.12)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0a4a8f}
  .btn.green{background:linear-gradient(#2fe27d,#02a24d);box-shadow:0 5px 0 #016b30,inset 0 2px 0 #fff5}
  .btn.green:active{box-shadow:0 1px 0 #016b30}
  .btn.off{background:#666;box-shadow:0 5px 0 #333;color:#bbb}
  .btn[disabled]{filter:grayscale(.9) brightness(.6);cursor:not-allowed}
  .tools{display:flex;gap:8px}
  main{flex:1;display:flex;gap:12px;min-height:0}

  /* Stage */
  #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;padding:14px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3a3f45,#1b1d1f)}
  #rays{position:absolute;width:640px;height:640px;left:50%;top:44%;margin:-320px 0 0 -320px;border-radius:50%;opacity:.4;animation:rot 14s linear infinite;pointer-events:none;
    background:repeating-conic-gradient(var(--rc,#ffc400) 0 10deg,transparent 10deg 30deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 68%);mask:radial-gradient(circle,#000 0,transparent 68%)}
  @keyframes rot{to{transform:rotate(360deg)}}
  .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;position:relative;z-index:2}
  .stat{background:linear-gradient(#45494e,#33363a);border:3px solid #0d0e0f;border-radius:10px;padding:6px 14px;font-size:13px;text-align:center;color:#ddd;box-shadow:0 3px 0 #0006}
  .stat b{display:block;color:var(--yellow);font-size:20px}
  #petWrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
  #pet{width:min(250px,42vw);height:min(250px,42vw);border-radius:34px;border:7px solid #0d0e0f;background:linear-gradient(#fff6,#fff0 50%),var(--pc,#ffb300);box-shadow:0 0 0 5px var(--rc,#ffc400),0 12px 0 #0008,inset 0 -16px 0 #0003,0 0 40px var(--rc,#ffc400);display:flex;align-items:center;justify-content:center;font-size:min(140px,24vw);cursor:pointer;transition:transform .08s;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{translate:0 -10px}}
  #pet.pop{transform:scale(.88) rotate(-5deg)}
  #pet.secret{animation:bob 2.4s ease-in-out infinite,hue 3s linear infinite}
  @keyframes hue{to{filter:hue-rotate(360deg)}}
  #shadow{width:min(200px,36vw);height:22px;border-radius:50%;background:#0008;margin-top:14px;filter:blur(3px)}
  #petName{font-size:26px;text-shadow:0 3px 0 #000;position:relative;z-index:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .badge{font-size:13px;border:3px solid #0d0e0f;border-radius:8px;padding:2px 10px;color:#111;background:var(--rc,#fff);text-shadow:none}
  .hint{font-size:13px;color:#dfefff;text-shadow:0 2px 0 #000;position:relative;z-index:2;text-align:center}
  .float{position:absolute;pointer-events:none;color:var(--yellow);font-size:26px;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;animation:fl .9s ease-out forwards;z-index:8}
  @keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-100px) scale(1.4)}}
  .spark{position:absolute;pointer-events:none;font-size:20px;animation:sp .7s ease-out forwards;z-index:7}
  @keyframes sp{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(240deg)}}

  /* Side */
  #side{flex:1.05;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .tabs{display:flex;gap:6px;padding:10px 10px 0}
  .tab{flex:1;font-family:inherit;font-weight:800;text-transform:capitalize;padding:11px;border:3px solid #0d0e0f;border-bottom:none;border-radius:10px 10px 0 0;background:#4a4d51;color:#ccc;cursor:pointer;font-size:16px}
  .tab.on{background:linear-gradient(#27b5ff,#0087e0);color:#fff;text-shadow:0 2px 0 #0006}
  #panel{flex:1;overflow:auto;padding:12px;background:var(--panel);margin:0 10px 10px;border:3px solid #0d0e0f;border-radius:0 0 10px 10px;display:flex;flex-direction:column;gap:12px}
  #panel::-webkit-scrollbar{width:10px}#panel::-webkit-scrollbar-thumb{background:#0087e0;border-radius:6px}

  /* Egg cards */
  .egg-card{background:linear-gradient(#3b3f44,#2a2d30);border:3px solid #0d0e0f;border-radius:12px;padding:10px;box-shadow:0 4px 0 #0006;display:flex;flex-direction:column;gap:10px}
  .egg-top{display:flex;align-items:center;gap:14px}
  .egg-top .nm{flex:1;font-size:19px;text-shadow:0 2px 0 #000}
  .egg-top .nm small{display:block;color:#b8bec4;font-size:12px;font-weight:700}
  .egg{width:56px;height:70px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;border:4px solid #0d0e0f;position:relative;flex:none;
    background:radial-gradient(ellipse at 32% 26%,#fff9 0,transparent 38%),radial-gradient(circle at 30% 60%,var(--sp) 0 7px,transparent 8px),radial-gradient(circle at 68% 50%,var(--sp) 0 9px,transparent 10px),radial-gradient(circle at 55% 78%,var(--sp) 0 6px,transparent 7px),var(--eg);
    box-shadow:inset -8px -10px 0 #0003,0 5px 0 #0005}
  .egg-card:hover .egg{animation:wob .6s ease-in-out infinite}
  @keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  .pet-row{display:flex;gap:8px;flex-wrap:wrap}
  .pmini{flex:1;min-width:70px;background:#202224;border:3px solid var(--rc);border-radius:10px;text-align:center;padding:6px 4px;cursor:help;transition:transform .1s;position:relative}
  .pmini:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 0 14px var(--rc)}
  .pmini .e{font-size:34px;display:block}
  .pmini .c{font-size:12px;color:#eee}
  .pmini .r{font-size:10px;color:var(--rc)}

  /* Inventory */
  .inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
  .pcard{background:linear-gradient(#3b3f44,#26292c);border:3px solid var(--rc);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;position:relative;transition:transform .1s;box-shadow:0 4px 0 #0006}
  .pcard:hover{transform:translateY(-4px);box-shadow:0 0 14px var(--rc),0 4px 0 #0006}
  .pcard .e{font-size:42px;display:block}
  .pcard .n{font-size:12px}
  .pcard .r{font-size:11px;color:var(--rc)}
  .pcard .cnt{position:absolute;top:-8px;right:-6px;background:var(--yellow);color:#111;border:2px solid #111;border-radius:8px;font-size:11px;padding:0 6px}
  .pcard.eq{outline:4px solid var(--green);outline-offset:1px}
  .pcard.eq::after{content:"Equipped";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:var(--green);border:2px solid #111;border-radius:6px;padding:0 6px;font-size:10px}
  .pcard.lock{filter:brightness(.7)}
  .pcard.lock .e{filter:brightness(0);opacity:.7}
  .pcard.lock .n{color:#888}

  /* rarity text */
  .t-Common{color:var(--Common)}.t-Uncommon{color:var(--Uncommon)}.t-Rare{color:var(--Rare)}.t-Epic{color:var(--Epic)}.t-Legendary{color:var(--Legendary)}.t-Mythic{color:var(--Mythic)}
  .t-Secret{background:linear-gradient(90deg,#ff3b3b,#ffd93b,#3bff6a,#3bd5ff,#7a3bff,#ff3bd5,#ff3b3b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rb 2s linear infinite}
  @keyframes rb{to{background-position:200% 0}}
  .secretBorder{animation:sbord 2s linear infinite}
  @keyframes sbord{0%{border-color:#ff3b3b}20%{border-color:#ffd93b}40%{border-color:#3bff6a}60%{border-color:#3bd5ff}80%{border-color:#c03bff}100%{border-color:#ff3b3b}}

  /* Tooltip */
  #tip{position:fixed;z-index:200;pointer-events:none;background:#15171a;border:4px solid var(--rc,#fff);border-radius:12px;padding:10px 14px;min-width:190px;box-shadow:0 8px 0 #0008,0 0 24px var(--rc,#fff);opacity:0;transform:scale(.9);transition:opacity .1s,transform .1s}
  #tip.show{opacity:1;transform:scale(1)}
  #tip .h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  #tip .h .e{font-size:40px}
  #tip .h b{font-size:18px;display:block}
  #tip .h span{font-size:13px}
  #tip .row{display:flex;justify-content:space-between;gap:16px;font-size:14px;padding:3px 0;border-top:2px solid #fff1}
  #tip .row i{font-style:normal;color:var(--yellow)}
  #tip .row em{font-style:normal;color:#aaa}

  #toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--dark);border:4px solid #0d0e0f;border-radius:12px;padding:10px 22px;font-size:18px;transition:transform .25s;z-index:150;box-shadow:0 6px 0 #0008}
  #toast.show{transform:translateX(-50%) translateY(0)}

  /* Hatch */
  #hatch{position:fixed;inset:0;background:radial-gradient(circle,#000a,#000e);display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;z-index:120;text-align:center}
  #hatch.on{display:flex}
  #hegg{transform:scale(2.6);animation:shake .45s infinite;margin:40px}
  @keyframes shake{0%,100%{rotate:-12deg}50%{rotate:12deg}}
  #reveal{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
  #reveal .big{font-size:140px;animation:boom .7s cubic-bezier(.2,2,.4,1);position:relative;z-index:2}
  #reveal .burst{position:absolute;width:520px;height:520px;top:50%;left:50%;margin:-300px 0 0 -260px;border-radius:50%;opacity:.6;animation:rot 6s linear infinite;
    background:repeating-conic-gradient(var(--rc) 0 8deg,transparent 8deg 24deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 70%);mask:radial-gradient(circle,#000 0,transparent 70%)}
  @keyframes boom{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
  #hatchTxt{font-size:28px;text-shadow:0 3px 0 #000;position:relative;z-index:2}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:130}
  #flash.go{animation:fo .6s ease-out}
  @keyframes fo{from{opacity:.9}to{opacity:0}}

  #start{position:fixed;inset:0;background:linear-gradient(#52c0ff,#0b6fd1);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px}
  #start h1{font-size:clamp(52px,12vw,120px)}
  #start .btn{font-size:30px;padding:14px 46px}
  #start .row{font-size:80px;animation:bob 2s ease-in-out infinite}
  @media(max-width:780px){main{flex-direction:column;overflow:auto}#stage{flex:none;padding:10px}#pet{width:130px;height:130px;font-size:72px}#rays{width:400px;height:400px;margin:-200px 0 0 -200px}#side{flex:none;min-height:420px}}

  /* ===== ROBLOX UPGRADE ===== */
  body{background:
    radial-gradient(ellipse 220px 70px at 12% 16%,#fffc 0 60%,transparent 62%),
    radial-gradient(ellipse 300px 90px at 78% 10%,#fffb 0 60%,transparent 62%),
    radial-gradient(ellipse 240px 70px at 55% 30%,#fff8 0 60%,transparent 62%),
    linear-gradient(#3aa9ff,#8fd6ff 70%,#bfeaff)}
  body::after{content:"";position:fixed;left:-20%;right:-20%;bottom:0;height:34vh;z-index:0;pointer-events:none;
    background:linear-gradient(90deg,#0003 2px,transparent 2px) 0 0/60px 60px,linear-gradient(#0003 2px,transparent 2px) 0 0/60px 60px,linear-gradient(#6c7a89,#47525e);
    transform:perspective(500px) rotateX(55deg);transform-origin:bottom}
  header{background:linear-gradient(#2b2e33,#1b1d20);border:4px solid #0d0e0f;border-radius:16px;padding:8px 14px;box-shadow:0 6px 0 #0007,inset 0 2px 0 #fff2}
  h1{background:linear-gradient(#fff,#bfe6ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 4px 0 #0a4a8f) drop-shadow(0 6px 0 #000a);text-shadow:none;transform:rotate(-2deg)}
  #start h1{background:none;color:#fff;-webkit-text-stroke:3px #0a2a52;filter:none;text-shadow:0 5px 0 #0a4a8f,0 8px 0 #0006}
  .box{background:linear-gradient(#34373b,#222426);border:4px solid #0d0e0f;border-radius:18px;box-shadow:0 8px 0 #0008,inset 0 3px 0 #fff3,inset 0 0 0 2px #ffffff0d}
  .coins{border-color:#0d0e0f;background:linear-gradient(#3a3d41,#1c1e20);box-shadow:0 5px 0 #0007,inset 0 0 0 2px #ffc80055}
  .coins #coins{text-shadow:0 3px 0 #000;-webkit-text-stroke:1px #6a4d00;paint-order:stroke fill}
  .btn{border-radius:12px;border-width:3px;letter-spacing:.3px;background:linear-gradient(#4cc3ff,#0a8ae6);position:relative;overflow:hidden}
  .btn::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(#fff6,#fff0);pointer-events:none}
  .btn.red{background:linear-gradient(#ff6a5f,#d11f15);box-shadow:0 5px 0 #7a0f09,inset 0 2px 0 #fff5}
  .btn.red:active{box-shadow:0 1px 0 #7a0f09}
  .btn.green{font-size:17px;padding:11px 16px}
  #stage{background:radial-gradient(circle at 50% 38%,#4b5258,#1a1c1e 75%)}
  #stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#ffffff08 0 14px,transparent 14px 28px);pointer-events:none}
  .stat{border-radius:12px;background:linear-gradient(#4a4e53,#2e3134);min-width:110px}
  .stat b{text-shadow:0 2px 0 #000}
  #pet{border-radius:40px;border-width:8px;background:linear-gradient(#fff7,#fff0 55%),radial-gradient(circle at 30% 25%,#fff5,transparent 45%),var(--pc,#ffb300)}
  #shadow{width:min(230px,40vw);height:26px;background:radial-gradient(ellipse,var(--rc,#ffc400) 0,#0009 55%,transparent 72%);filter:none;opacity:.9}
  .badge{border-radius:20px;font-weight:900;box-shadow:0 3px 0 #0006}
  .tabs{padding:12px 12px 0;gap:8px}
  .tab{border-radius:14px 14px 0 0;background:linear-gradient(#5a5e63,#44474b);transition:filter .1s}
  .tab:hover{filter:brightness(1.15)}
  .tab.on{background:linear-gradient(#4cc3ff,#0a8ae6)}
  #panel{background:linear-gradient(#2a2c2f,#232527);border-radius:0 0 14px 14px;margin:0 12px 12px;box-shadow:inset 0 4px 10px #0006}
  .egg-card{border-radius:16px;background:linear-gradient(#41454a,#2b2e31);box-shadow:0 5px 0 #0007,inset 0 2px 0 #fff2}
  .egg-top .nm{font-size:21px}
  .pmini{border-radius:12px;background:linear-gradient(#2c2f32,#1a1c1e);min-width:88px;padding:8px 4px;box-shadow:inset 0 0 12px #0008}
  .pmini .r{display:block;font-size:12px;white-space:nowrap;margin-top:2px}
  .pmini .pct{color:#fff}
  .pcard{border-radius:14px;background:linear-gradient(#44484d,#2a2d30)}
  .pcard.lock{filter:brightness(.8)}
  /* secret rainbow: border + glow */
  @keyframes tipRb{0%,100%{border-color:#ff3b3b;box-shadow:0 8px 0 #0008,0 0 14px #ff3b3b,0 0 34px #ff3b3b}20%{border-color:#ffd93b;box-shadow:0 8px 0 #0008,0 0 14px #ffd93b,0 0 34px #ffd93b}40%{border-color:#3bff6a;box-shadow:0 8px 0 #0008,0 0 14px #3bff6a,0 0 34px #3bff6a}60%{border-color:#3bd5ff;box-shadow:0 8px 0 #0008,0 0 14px #3bd5ff,0 0 34px #3bd5ff}80%{border-color:#c03bff;box-shadow:0 8px 0 #0008,0 0 14px #c03bff,0 0 34px #c03bff}}
  @keyframes cardRb{0%,100%{box-shadow:0 0 16px #ff3b3b}20%{box-shadow:0 0 16px #ffd93b}40%{box-shadow:0 0 16px #3bff6a}60%{box-shadow:0 0 16px #3bd5ff}80%{box-shadow:0 0 16px #c03bff}}
  #tip.secret{animation:tipRb 2s linear infinite}
  .secretBorder:hover{animation:sbord 2s linear infinite,cardRb 2s linear infinite}
  #tip{border-radius:16px}
  #tip .h .e.lk{filter:brightness(0)}
  #modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:400;padding:16px}
  #modal.on{display:flex}
  #modal .mbox{background:linear-gradient(#34373b,#222426);border:4px solid #0d0e0f;border-radius:18px;padding:22px 26px;text-align:center;max-width:380px;box-shadow:0 8px 0 #000a;display:flex;flex-direction:column;gap:14px}
  #modal h2{margin:0;font-size:28px;text-shadow:0 3px 0 #000}
  #modal p{margin:0;color:#ccd;font-size:15px}
  #modal .bt{display:flex;gap:12px;justify-content:center}

  /* ===== ROBLOX STYLE v3: blue blocks ===== */
  body{background:
    linear-gradient(#ffffff26,#ffffff26) 0 0/100% 100% no-repeat,
    repeating-conic-gradient(#1e7bff 0 25%,#3a97ff 0 50%) 0 0/128px 128px;
    animation:blocks 10s linear infinite}
  @keyframes blocks{to{background-position:0 0,128px 128px}}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;height:auto;left:0;right:0;transform:none;
    background:radial-gradient(circle at 50% 40%,transparent 35%,#04206b99 100%),repeating-conic-gradient(#ffffff10 0 25%,transparent 0 50%) 64px 64px/128px 128px}
  #floaters span{opacity:.5;filter:drop-shadow(0 4px 0 #0a2a8a88)}
  header{background:none;border:none;box-shadow:none;padding:0 4px}
  h1{color:#ffe14d;background:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-stroke:5px #101a4a;paint-order:stroke fill;filter:none;text-shadow:0 6px 0 #101a4a,0 10px 0 #0004;transform:rotate(-3deg);letter-spacing:2px;text-transform:uppercase}
  .box{background:linear-gradient(#1f4fb8,#12307f);border:4px solid #08123a;border-radius:20px;box-shadow:0 8px 0 #08123a,inset 0 0 0 3px #5fa8ff,inset 0 6px 0 #ffffff22}
  .coins{background:linear-gradient(#1f4fb8,#12307f);border-radius:40px;padding:6px 22px 6px 14px;box-shadow:0 6px 0 #08123a,inset 0 0 0 3px #5fa8ff}
  .coins small{color:#a9d0ff}
  .btn{background:linear-gradient(#5ed0ff,#1d8cf0);border:3px solid #08123a;box-shadow:0 5px 0 #08123a,inset 0 0 0 2px #ffffff55;text-transform:uppercase;letter-spacing:.5px;font-size:14px}
  .btn:active{box-shadow:0 1px 0 #08123a,inset 0 0 0 2px #ffffff55}
  .btn.green{background:linear-gradient(#58ff8f,#0bb24a);box-shadow:0 5px 0 #08123a,inset 0 0 0 2px #ffffff66}
  .btn.red{background:linear-gradient(#ff7a6e,#d9261b);box-shadow:0 5px 0 #08123a,inset 0 0 0 2px #ffffff55}
  .btn.off{background:#7a86a8;box-shadow:0 5px 0 #08123a}

  .egg-top .nm small{color:#b6d4ff}

  .pmini{min-width:0;overflow:hidden;padding:8px 2px;background:linear-gradient(#0f2a70,#0a1c52);box-shadow:inset 0 0 12px #000a}

  #modal .mbox{background:linear-gradient(#1f4fb8,#12307f);border-color:#08123a;box-shadow:0 8px 0 #08123a,inset 0 0 0 3px #5fa8ff}
  #toast{background:#12307f;border-color:#08123a}

  /* ===== v4: polish ===== */
  :root{--ol:-2px -2px 0 #08123a,2px -2px 0 #08123a,-2px 2px 0 #08123a,2px 2px 0 #08123a,0 3px 0 #08123a}
  html,body{font-family:"Nunito","Trebuchet MS",Arial,sans-serif;font-weight:900}
  h1,.btn,.tab,.stat b,#coins,.nm,.badge,#petName,#hatchTxt,#toast,#tip .h b,#modal h2,.cnt,.pcard.eq::after,.float,.pmini .r,.pcard .r,.pcard .n{font-family:"Lilita One","Nunito",sans-serif;font-weight:400;letter-spacing:.4px}
  body{background:linear-gradient(#ffffff30,#0000 40%,#00104033),repeating-conic-gradient(#2a86ff 0 25%,#3d9bff 0 50%) 0 0/140px 140px;animation:blocks 14s linear infinite}
  @keyframes blocks{to{background-position:0 0,140px 140px}}
  body::after{background:radial-gradient(circle at 50% 35%,transparent 30%,#03185e88 100%)}
  #app{max-width:1200px;padding:14px;gap:14px}
  h1{font-size:clamp(34px,5.5vw,58px);color:#ffe14d;-webkit-text-stroke:0;text-shadow:-3px -3px 0 #101a4a,3px -3px 0 #101a4a,-3px 3px 0 #101a4a,3px 3px 0 #101a4a,0 7px 0 #101a4a,0 11px 0 #0005;letter-spacing:3px}
  .coins{padding:6px 26px 6px 12px;gap:12px;background:linear-gradient(#1b46a8,#10296f)}

  .coin-ico{font-size:38px;filter:drop-shadow(0 3px 0 #08123a)}
  .btn{font-size:15px;padding:10px 16px;letter-spacing:1px;text-shadow:var(--ol)}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.1)}

  .tools{gap:10px}
  .stat{font-family:"Nunito";font-size:13px;letter-spacing:.5px;text-transform:uppercase;padding:8px 18px;min-width:130px}

  #stage{gap:14px}
  #pet{width:min(270px,44vw);height:min(270px,44vw);border-radius:44px;font-size:min(150px,25vw);filter:drop-shadow(0 6px 0 #0004)}
  #pet.secret{filter:drop-shadow(0 6px 0 #0004) hue-rotate(0deg)}
  #petName{font-size:30px;text-shadow:var(--ol);gap:12px}
  .badge{font-size:15px;padding:3px 14px;border-radius:20px;text-shadow:none;letter-spacing:1px;text-transform:uppercase}
  .hint{font-family:"Nunito";font-size:13px;color:#d9eaff;text-shadow:0 2px 0 #08123a,0 0 8px #08123a;letter-spacing:.4px}
  .float{font-size:30px;color:#ffe14d;-webkit-text-stroke:0;text-shadow:var(--ol)}

  .tab:hover{transform:translateY(-2px)}
  .tab.on{text-shadow:0 2px 0 #fff8;color:#5a3300}
  .egg-top .nm{font-size:25px;text-shadow:var(--ol)}
  .egg-top .nm small{font-family:"Nunito";font-size:12px;color:#aed0ff;text-shadow:none;margin-top:2px}
  .egg{width:64px;height:80px;filter:drop-shadow(0 4px 0 #08123a)}
  .egg-card{padding:12px;gap:12px}
  .pmini .e{font-size:38px;filter:drop-shadow(0 3px 0 #0006)}
  .pmini .r{font-size:12px}
  .pmini .pct{color:#fff;text-shadow:0 2px 0 #000}
  .pcard .e{font-size:46px;filter:drop-shadow(0 3px 0 #0006)}
  .pcard.lock .e{filter:brightness(0);opacity:.75}
  .pcard .n{font-size:15px;text-shadow:0 2px 0 #08123a}
  .pcard .r{font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .pcard .cnt{font-size:13px;padding:1px 8px;border-color:#08123a}
  #tip{background:linear-gradient(#10296f,#0a1a4e)}
  #tip .h b{font-size:21px;text-shadow:var(--ol)}
  #tip .h span{font-family:"Lilita One";font-size:14px;letter-spacing:1px;text-transform:uppercase}
  #tip .row{font-size:14px}
  #toast{font-size:20px;text-shadow:var(--ol)}
  #hatchTxt{font-size:32px;text-shadow:var(--ol)}
  #modal h2{font-size:32px;text-shadow:var(--ol)}

  /* ===== v5: no outlines on text/emoji ===== */
  :root{--ol:none}
  *{text-shadow:none!important;-webkit-text-stroke:0!important}
  .coin-ico,.pmini .e,.pcard .e,#pet,#pet.secret{filter:none}

  /* ===== v6 ===== */
  #pet{animation:none;box-shadow:0 0 0 5px var(--rc,#ffc400),0 0 40px var(--rc,#ffc400),inset 0 -16px 0 #0003}
  #pet.secret{animation:hue 3s linear infinite}

  /* ===== v7: hatch animation ===== */
  #hatch{padding-bottom:18vh;gap:10px}
  #hegg{animation:shake .4s infinite,ramp 1.9s ease-in forwards}
  @keyframes ramp{from{scale:.9}to{scale:1.3}}
  #reveal .big{font-size:min(170px,34vw);filter:drop-shadow(0 0 28px var(--rc))}
  #reveal .burst{margin:-260px 0 0 -260px;opacity:.7}
  #hatchTxt:empty{display:none}
  #hatchTxt{animation:txtIn .5s .3s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes txtIn{from{opacity:0;transform:translateY(24px) scale(.8)}to{opacity:1;transform:none}}
</style>
</head>
<body>


<div id="app">
  <header>
    <div class="box coins"><span class="coin-ico">🪙</span><div><small>Coins</small><span id="coins">0</span></div></div>
    <div class="tools">
      <button class="btn" id="musicBtn">🎵 Music: On</button>
      <button class="btn" id="sfxBtn">🔊 Sounds: On</button>
      <button class="btn red" id="resetBtn">🗑 Reset Data</button>
    </div>
  </header>
  <main>
    <section id="stage" class="box">
      <div id="rays"></div>
      <div class="stats">
        <div class="stat">⚡ Per Click<b id="pc">1</b></div>
        <div class="stat">⏱️ Per Second<b id="ps">0</b></div>
      </div>
      <div id="petWrap">
        <div id="pet">🐣</div>
      </div>
      <div id="petName"></div>
      <div class="hint">Tap The Pet To Earn Coins · Hold Space To Click Fast</div>
    </section>
    <section id="side" class="box">
      <div class="tabs">
        <button class="tab on" data-t="egg">🥚 Eggs</button>
        <button class="tab" data-t="pets">🐾 My Pets</button>
      </div>
      <div id="panel"></div>
    </section>
  </main>
</div>

<div id="modal"><div class="mbox"><h2>⚠ Reset Data?</h2><p>This Will Delete All Your Coins, Pets And Progress. This Cannot Be Undone!</p><div class="bt"><button class="btn" id="noReset">Cancel</button><button class="btn red" id="yesReset">Yes, Reset</button></div></div></div>
<div id="tip"></div>
<div id="toast"></div>
<div id="flash"></div>
<div id="hatch"><div class="egg" id="hegg"></div><div id="hatchTxt"></div></div>

<script>
/* ---------- Data ---------- */
const RC={Common:"#cfd8dc",Uncommon:"#5dff7a",Rare:"#3fb4ff",Epic:"#c26bff",Legendary:"#ffc400",Mythic:"#ff3d77",Secret:"#ffffff"};
const PC={Common:"#b0bec5",Uncommon:"#7be495",Rare:"#6ac5ff",Epic:"#d79bff",Legendary:"#ffd75e",Mythic:"#ff7da1",Secret:"#e8e8ff"};
/* click = coins multiplier per click, sec = coins per second */
const PETS={
  cat:{n:"Cat",e:"🐱",r:"Common",click:2,sec:1},
  dog:{n:"Dog",e:"🐶",r:"Uncommon",click:4,sec:2},
  bunny:{n:"Bunny",e:"🐰",r:"Rare",click:8,sec:5},
  fox:{n:"Fox",e:"🦊",r:"Rare",click:20,sec:15},
  panda:{n:"Panda",e:"🐼",r:"Epic",click:50,sec:40},
  unicorn:{n:"Unicorn",e:"🦄",r:"Legendary",click:150,sec:150},
  octopus:{n:"Octopus",e:"🐙",r:"Rare",click:80,sec:60},
  griffin:{n:"Griffin",e:"🦅",r:"Epic",click:250,sec:200},
  phoenix:{n:"Phoenix",e:"🔥",r:"Legendary",click:800,sec:600},
  dragon:{n:"Dragon",e:"🐲",r:"Mythic",click:5000,sec:4000},
  alien:{n:"Void Alien",e:"👽",r:"Secret",click:30000,sec:25000}
};
const EGGS=[
  {n:"Starter Egg",c:100,eg:"#f6e7c6",sp:"#d9a066",pets:[["cat",60],["dog",30],["bunny",10]]},
  {n:"Magic Egg",c:2000,eg:"#5ee0a0",sp:"#1c9e6a",pets:[["fox",60],["panda",30],["unicorn",10]]},
  {n:"Cosmic Egg",c:50000,eg:"#8a4dff",sp:"#ffd34d",pets:[["octopus",50],["griffin",30],["phoenix",18.5],["dragon",1],["alien",0.5]]}
];
const KEY="petClickerSave3";
let S={coins:0,inv:{},eq:null,music:true,sfx:true,hatched:0,clicks:0};
try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&typeof d==="object")S=Object.assign(S,d)}catch(e){}
if(typeof S.coins!=="number"||!isFinite(S.coins))S.coins=0;
if(!S.inv||typeof S.inv!=="object")S.inv={};
Object.keys(S.inv).forEach(k=>{if(!PETS[k])delete S.inv[k]});
if(S.eq&&!PETS[S.eq])S.eq=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- Helpers ---------- */
const $=id=>document.getElementById(id);
const fmt=n=>{n=Math.floor(n);if(n<1000)return""+n;const u=["K","M","B","T","Qa"];let i=-1,v=n;while(v>=1000&&i<u.length-1){v/=1000;i++}return v.toFixed(v<10?2:v<100?1:0).replace(/\.0+$/,"")+u[i]};
const cap=s=>s.replace(/\b\w/g,c=>c.toUpperCase());
const perClick=()=>S.eq?PETS[S.eq].click:1;
const perSec=()=>S.eq?PETS[S.eq].sec:0;
let tab="egg";


/* ---------- Audio ---------- */
let AC,master,musicGain,sfxGain,musicTimer,step=0,nextT=0;
function initAudio(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=S.music?.22:0;musicGain.connect(master);
  sfxGain=AC.createGain();sfxGain.gain.value=S.sfx?.6:0;sfxGain.connect(master);
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(freq,t,dur,type,vol,dest,slideTo){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02);
}
function noise(t,dur,vol,dest,hp){
  const len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=buf;
  const f=AC.createBiquadFilter();f.type="highpass";f.frequency.value=hp||6000;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t);
}
const CH=[[0,4,7,12],[-3,0,4,9],[-7,-3,0,5],[-5,-1,2,7]];
const ROOT=[36,33,41,43];
const MEL=[[0,1,2,3,2,1,2,1],[3,2,1,2,3,2,1,0],[0,2,1,3,2,3,1,2],[3,3,2,1,2,1,0,1]];
function schedule(){
  const bpm=136,sd=60/bpm/2;
  while(nextT<AC.currentTime+.25){
    const bar=Math.floor(step/8)%4,s=step%8,t=nextT;
    const ch=CH[bar];
    const mi=MEL[Math.floor(step/32)%2===0?bar:(bar+1)%4][s];
    tone(mf(72+ch[mi]),t,sd*.9,"square",.12,musicGain);
    if(s%2===0)tone(mf(ROOT[bar]+(s===4?7:0)),t,sd*1.7,"triangle",.4,musicGain);
    if(s===0||s===4)tone(150,t,.12,"sine",.8,musicGain,40);
    if(s%2===1)noise(t,.04,.35,musicGain,7000);
    if(s===2||s===6)noise(t,.09,.3,musicGain,3000);
    if(s===0)tone(mf(60+ch[0]),t,sd*8,"sine",.06,musicGain);
    nextT+=sd;step++;
  }
}
function startMusic(){
  initAudio();if(AC.state==="suspended")AC.resume();
  if(musicTimer)return;
  nextT=AC.currentTime+.05;musicTimer=setInterval(schedule,80);
}
const sfx={
  click(){if(!AC||!S.sfx)return;const t=AC.currentTime,p=500+Math.random()*250;tone(p,t,.1,"square",.5,sfxGain,p*1.8);tone(p*2,t+.03,.08,"triangle",.3,sfxGain)},
  coin(){if(!AC||!S.sfx)return;const t=AC.currentTime;tone(988,t,.07,"square",.3,sfxGain);tone(1319,t+.07,.18,"square",.3,sfxGain)},
  buy(){if(!AC||!S.sfx)return;const t=AC.currentTime;[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.14,"square",.35,sfxGain))},
  err(){if(!AC||!S.sfx)return;const t=AC.currentTime;tone(160,t,.25,"sawtooth",.4,sfxGain,90)},
  tab(){if(!AC||!S.sfx)return;tone(700,AC.currentTime,.06,"triangle",.4,sfxGain)},
  hover(){if(!AC||!S.sfx)return;tone(1200,AC.currentTime,.04,"triangle",.12,sfxGain)},
  shake(){if(!AC||!S.sfx)return;const t=AC.currentTime;tone(220,t,.12,"square",.3,sfxGain,160);noise(t,.08,.4,sfxGain,1500)},
  hatch(rar){if(!AC||!S.sfx)return;const t=AC.currentTime;
    noise(t,.3,.6,sfxGain,800);
    const tier={Common:0,Uncommon:0,Rare:1,Epic:2,Legendary:3,Mythic:4,Secret:5}[rar]||0;
    const base=[523,659,784,1047,1319,1568,2093,2637,3136];
    base.slice(0,4+tier).forEach((f,i)=>tone(f,t+.1+i*.09,.3,"square",.35,sfxGain));
    if(tier>=3)base.slice(0,4+tier).forEach((f,i)=>tone(f/2,t+.1+i*.09,.5,"triangle",.4,sfxGain));
    if(tier>=4)for(let i=0;i<8;i++)tone(2000+i*300,t+.9+i*.05,.2,"sine",.25,sfxGain);
    if(tier>=5){for(let i=0;i<12;i++)tone(800+Math.random()*2400,t+1+i*.06,.15,"square",.15,sfxGain);tone(100,t+.1,1.2,"sawtooth",.35,sfxGain,400)}
  },
  equip(){if(!AC||!S.sfx)return;const t=AC.currentTime;tone(600,t,.07,"square",.3,sfxGain);tone(900,t+.07,.1,"square",.3,sfxGain)}
};

/* ---------- Tooltip ---------- */
const tip=$("tip");
function tipHTML(el){
  const id=el.dataset.pet,p=PETS[id],ch=el.dataset.chance,own=S.inv[id]||0;
  const locked=!ch&&!own;
  let h=`<div class="h"><div class="e${locked?" lk":""}">${p.e}</div><div><b>${locked?"???":p.n}</b><span class="t-${p.r}">${p.r}</span></div></div>`;
  h+=`<div class="row"><em>Click Power</em><i>x${fmt(p.click)} Coins</i></div>`;
  h+=`<div class="row"><em>Coins Per Second</em><i>+${fmt(p.sec)}</i></div>`;
  if(ch)h+=`<div class="row"><em>Hatch Chance</em><i>${ch}%</i></div>`;
  else{h+=`<div class="row"><em>Owned</em><i>${own}</i></div>`;h+=`<div class="row"><em>Status</em><i>${S.eq===id?"Equipped":own?"Click To Equip":"Not Found Yet"}</i></div>`}
  return h;
}
function showTip(el,x,y){
  tip.style.setProperty("--rc",RC[PETS[el.dataset.pet].r]);
  tip.classList.toggle("secret",PETS[el.dataset.pet].r==="Secret");tip.innerHTML=tipHTML(el);tip.classList.add("show");moveTip(x,y);
}
function moveTip(x,y){
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let l=x+16,t=y+16;
  if(l+w>innerWidth-8)l=x-w-16;
  if(t+h>innerHeight-8)t=innerHeight-h-8;
  tip.style.left=Math.max(8,l)+"px";tip.style.top=Math.max(8,t)+"px";
}
const hideTip=()=>tip.classList.remove("show");
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-pet]");if(el&&!el.contains(e.relatedTarget)){showTip(el,e.clientX,e.clientY);sfx.hover()}});
document.addEventListener("mousemove",e=>{if(tip.classList.contains("show"))moveTip(e.clientX,e.clientY)});
document.addEventListener("mouseout",e=>{const el=e.target.closest("[data-pet]");if(el&&!el.contains(e.relatedTarget))hideTip()});
let tipT;
document.addEventListener("touchstart",e=>{
  const el=e.target.closest("[data-pet]");if(!el){hideTip();return}
  const r=el.getBoundingClientRect();showTip(el,r.left,r.bottom-10);clearTimeout(tipT);tipT=setTimeout(hideTip,2500);
},{passive:true});

/* ---------- UI ---------- */
function toast(msg){const t=$("toast");t.textContent=cap(msg);t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),1800)}
function render(){
  hideTip();
  $("coins").textContent=fmt(S.coins);
  $("pc").textContent=fmt(perClick());$("ps").textContent=fmt(perSec());
  const pe=$("pet"),st=$("stage");
  if(S.eq){
    const p=PETS[S.eq];
    pe.textContent=p.e;st.style.setProperty("--rc",RC[p.r]);st.style.setProperty("--pc",PC[p.r]);
    pe.classList.toggle("secret",p.r==="Secret");
    $("petName").innerHTML=`${p.n} <span class="badge" style="--rc:${RC[p.r]}">${p.r}</span>`;
  }else{
    pe.textContent="🐣";st.style.setProperty("--rc","#ffc400");st.style.setProperty("--pc","#ffb300");pe.classList.remove("secret");
    $("petName").innerHTML="No Pet Equipped · Hatch One!";
  }
  $("musicBtn").textContent="🎵 Music: "+(S.music?"On":"Off");$("musicBtn").classList.toggle("off",!S.music);
  $("sfxBtn").textContent="🔊 Sounds: "+(S.sfx?"On":"Off");$("sfxBtn").classList.toggle("off",!S.sfx);
  renderPanel();
}
const rcStyle=r=>`style="--rc:${RC[r]}"`;
function renderPanel(){
  const p=$("panel");let h="";
  if(tab==="egg"){
    EGGS.forEach((g,i)=>{
      h+=`<div class="egg-card"><div class="egg-top"><div class="egg" style="--eg:${g.eg};--sp:${g.sp}"></div>
        <div class="nm">${g.n}<small>Hover A Pet To See Its Stats</small></div>
        <button class="btn green" data-e="${i}" ${S.coins<g.c?"disabled":""}>🪙 ${fmt(g.c)}</button></div><div class="pet-row">`;
      g.pets.forEach(([id,ch])=>{const q=PETS[id];
        h+=`<div class="pmini ${q.r==="Secret"?"secretBorder":""}" ${rcStyle(q.r)} data-pet="${id}" data-chance="${ch}"><span class="e">${q.e}</span><span class="r"><span class="pct">${ch}%</span> <span class="t-${q.r}">${q.r}</span></span></div>`});
      h+=`</div></div>`;
    });
  }else{
    const ids=Object.keys(PETS).sort((a,b)=>PETS[b].click-PETS[a].click);
    const found=ids.filter(id=>S.inv[id]).length;
    h=`<div class="hint" style="color:#ddd">Collection: ${found}/${ids.length} · Pets Hatched: ${S.hatched}<br>Tap A Pet To Equip It</div><div class="inv">`;
    ids.slice().reverse().forEach(id=>{const q=PETS[id],n=S.inv[id]||0;
      h+=`<div class="pcard ${n?"":"lock"} ${S.eq===id?"eq":""} ${q.r==="Secret"?"secretBorder":""}" ${rcStyle(q.r)} data-pet="${id}"${n?` data-own="1"`:""}>
        ${n>1?`<div class="cnt">x${n}</div>`:""}<span class="e">${q.e}</span><div class="n">${n?q.n:"???"}</div><div class="r t-${q.r}">${q.r}</div></div>`});
    h+="</div>";
  }
  const sc=p.scrollTop;p.innerHTML=h;p.scrollTop=sc;
}
function floatText(x,y,txt){
  const s=$("stage"),r=s.getBoundingClientRect(),el=document.createElement("div");
  el.className="float";el.textContent=txt;el.style.left=(x-r.left-20)+"px";el.style.top=(y-r.top-30)+"px";
  s.appendChild(el);setTimeout(()=>el.remove(),900);
}
function sparks(x,y){
  const s=$("stage"),r=s.getBoundingClientRect(),em=["⭐","✨","🪙"];
  for(let i=0;i<5;i++){
    const el=document.createElement("div");el.className="spark";el.textContent=em[i%3];
    el.style.left=(x-r.left)+"px";el.style.top=(y-r.top)+"px";
    el.style.setProperty("--dx",(Math.random()*160-80)+"px");el.style.setProperty("--dy",(-Math.random()*110-20)+"px");
    s.appendChild(el);setTimeout(()=>el.remove(),700);
  }
}
function updateTop(){
  $("coins").textContent=fmt(S.coins);
  document.querySelectorAll("[data-e]").forEach(b=>{b.disabled=S.coins<EGGS[b.dataset.e].c});
}

/* ---------- Actions ---------- */
function clickPet(e){
  const r=$("pet").getBoundingClientRect();
  const x=e.clientX||(r.left+r.width/2),y=e.clientY||(r.top+r.height/2);
  const v=perClick();S.coins+=v;S.clicks++;
  sfx.click();if(S.clicks%5===0)sfx.coin();if(S.clicks%10===0)save();
  floatText(x,y,"+"+fmt(v));sparks(x,y);
  const pe=$("pet");pe.classList.add("pop");setTimeout(()=>pe.classList.remove("pop"),80);
  updateTop();
}
let hatching=false;
function buyEgg(i){
  if(hatching)return;
  const g=EGGS[i];
  if(S.coins<g.c){sfx.err();toast("Not Enough Coins!");return}
  S.coins-=g.c;$("coins").textContent=fmt(S.coins);
  let roll=Math.random()*100,pick=g.pets[g.pets.length-1][0];
  for(const [id,ch] of g.pets){if(roll<ch){pick=id;break}roll-=ch}
  const p=PETS[pick];
  hatching=true;hideTip();
  const H=$("hatch"),he=$("hegg");
  he.style.display="block";he.style.setProperty("--eg",g.eg);he.style.setProperty("--sp",g.sp);
  $("hatchTxt").innerHTML="";
  const old=$("reveal");if(old)old.remove();
  H.classList.add("on");
  let n=0;const iv=setInterval(()=>{sfx.shake();if(++n>=5)clearInterval(iv)},350);
  setTimeout(()=>{
    he.style.display="none";
    const f=$("flash");f.classList.remove("go");void f.offsetWidth;f.classList.go;f.classList.add("go");
    const r=document.createElement("div");r.id="reveal";r.style.setProperty("--rc",RC[p.r]);
    r.innerHTML=`<div class="burst"></div><div class="big">${p.e}</div>`;
    H.insertBefore(r,$("hatchTxt"));
    sfx.hatch(p.r);
    S.inv[pick]=(S.inv[pick]||0)+1;S.hatched++;
    let msg=`You Got A <span class="t-${p.r}">${p.r} ${p.n}</span>!<br><span style="font-size:18px;color:#ffc800">x${fmt(p.click)} Click · +${fmt(p.sec)} Per Second</span>`;
    if(!S.eq||p.click>PETS[S.eq].click){S.eq=pick;msg+=`<br><span style="font-size:16px;color:#6dff8a">Auto Equipped!</span>`}
    $("hatchTxt").innerHTML=msg;
    save();
  },1900);
  setTimeout(()=>{H.classList.remove("on");hatching=false;render()},4600);
}
function toggleEquip(id){
  if(!S.inv[id]){sfx.err();toast("Hatch This Pet First!");return}
  if(S.eq===id){S.eq=null;sfx.tab()}else{S.eq=id;sfx.equip()}
  save();render();
}

/* ---------- Events ---------- */
$("pet").addEventListener("pointerdown",e=>{e.preventDefault();clickPet(e)});
$("panel").addEventListener("click",e=>{
  const g=e.target.closest("[data-e]"),p=e.target.closest(".pcard");
  if(g)buyEgg(+g.dataset.e);else if(p)toggleEquip(p.dataset.pet);
});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  tab=b.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));sfx.tab();hideTip();renderPanel();
}));
$("musicBtn").onclick=()=>{S.music=!S.music;if(musicGain)musicGain.gain.value=S.music?.22:0;sfx.tab();save();render()};
$("sfxBtn").onclick=()=>{S.sfx=!S.sfx;if(sfxGain)sfxGain.gain.value=S.sfx?.6:0;sfx.tab();save();render()};
$("resetBtn").onclick=()=>{sfx.tab();$("modal").classList.add("on")};
$("noReset").onclick=()=>{sfx.tab();$("modal").classList.remove("on")};
$("yesReset").onclick=()=>{
  S.coins=0;S.inv={};S.eq=null;S.hatched=0;S.clicks=0;save();
  $("modal").classList.remove("on");hideTip();sfx.err();render();toast("Data Reset!");
};
function firstGesture(){initAudio();if(AC.state==="suspended")AC.resume();startMusic();["pointerdown","keydown","touchstart"].forEach(t=>removeEventListener(t,firstGesture,true))}
["pointerdown","keydown","touchstart"].forEach(t=>addEventListener(t,firstGesture,true));
document.addEventListener("keydown",e=>{if(e.code==="Space"&&!hatching){e.preventDefault();clickPet({})}});

/* ---------- Loop ---------- */
setInterval(()=>{const v=perSec()/10;if(v>0){S.coins+=v;updateTop()}},100);
setInterval(save,3000);
addEventListener("pagehide",save);addEventListener("beforeunload",save);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
render();
</script>
</body>
</html>
